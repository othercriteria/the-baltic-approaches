# TOY SCENARIO — LANDJUT-shaped, NOT RESEARCHED.
#
# Every number here is a placeholder to exercise the machinery and
# surface tensions. The real OOB (6th Panzergrenadier Division,
# Jutland Division, Danish brigades; GDR 5th Army / Polish axis) is a
# research-shelf task and lives in the order-of-battle ledger when it
# exists. Do NOT let these numbers leak toward canon.

[meta]
name = "Toy LANDJUT opening, ~day 1-14"
year = 1986 # provisional; see planning/setting-time.md
season = "november"
seed = 1986 # weather draws; CLI --seed overrides

[params]
alpha = 0.055          # red daily fire effect on blue (per CV) — placeholder scale,
                       # but tuned so realized daily loss fractions land in the
                       # HERO band (division engagement norm ~1.0%/day, terrain/
                       # weather cells 1.6-3.6%/day, bn ceiling ~3.5% — Figs 47-48)
beta = 0.075           # blue on red (defender's advantage folded in) — placeholder
blue_tolerance = 0.03  # daily loss fraction blue will stand and absorb — HERO-
                       # anchored: above the 1%/day division norm, below the
                       # 3.5%/day short-of-catastrophe ceiling
w_max_kmd = 12.0       # max withdrawal, km/day — placeholder
march_kmd = 25.0       # unopposed road march, km/day — placeholder
advance_ratio = 3.0    # ratio for pressure advance (the contested 3:1!)
pressure_kmd = 4.0     # advance under pressure at ratio, km/day — placeholder
                       # (real advance rates await QJM/NP&W, holdings pipeline)

# Air model (November: short days suppress the totals; see
# planning/setting-time.md). All values placeholder scale.
# v3: sortie generation is a STOCK — points come from airframes,
# sorties cost airframes, deep costs more than close.
blue_aircraft = 90.0             # theater airframes available to BALTAP air
sorties_per_aircraft = 0.08      # air points per airframe per clear day
loss_per_close_point = 0.20      # airframes lost per close point-day
loss_per_deep_point = 0.45       # deep flies into the echelon's air defense
deep_fraction = 0.0              # share sent deep (CLI --deep overrides)

# Red air against blue mobilization (the documented Baltic threat
# axis: Danish roads, bridges, ports) — same late-and-weaker logic
red_deep_points = 3.0
red_deep_attrition_per_point = 0.010
red_deep_delay_per_point = 0.12
red_delay_cap_dpd = 0.5
close_support_cv_per_point = 1.2 # CV added to today's engagement per point
deep_attrition_per_point = 0.012 # march-column loss fraction per point-day
deep_delay_per_point = 0.15      # arrival delay added per point-day...
deep_delay_cap_dpd = 0.6         # ...capped: interdiction cannot STOP the
                                 # echelon, only make it late and weaker
close_sat_cv = 9.0               # close support saturates (diminishing
                                 # returns) — placeholder ceiling

# Weather gate on air (November Baltic PLACEHOLDER pending real
# climatology; planning/setting-time.md). Seeded: meta.seed.
wx_standdown_prob = 0.25   # fraction of days essentially stood down
wx_standdown_factor = 0.15
wx_min = 0.5
wx_max = 1.0

# Counterattack window (the tempo payload) — all placeholder scale
ca_enabled = true
ca_proj_mult = 2.5    # risk acceptance multiplier over defense tolerance
ca_at_ratio = 1.1     # red/blue MASSED CV ratio below which red is "spent"
ca_window_days = 2    # follow-on echelon must be at least this far out
ca_exploit = 1.6      # cohesion premium the spent echelon pays
ca_blue_cost = 1.25   # attacker's price blue pays
ca_kmd = 6.0          # ground retaken per counterattack day

# Command-decision layer (v4)
ca_min_reserve_cv = 8.0    # can't counterattack without a massed reserve
ca_recognition_days = 1    # G-3 lag: window must stand open this long
                           # before command acts (0 = the book's ideal;
                           # the protagonist's growth is this number)
emergency_commit_cv = 8.0  # line CV at which the reserve commits defensively
red_reinforces_success = true # arriving echelons go to the leading axis

# v5: red whole-echelon commitment discipline (the v4 finding —
# piecemeal commitment is suicide — given to red as doctrine)
red_commit_min_cv = 20.0   # mass before committing...
red_commit_max_wait = 2    # ...but never wait longer than this

# v5: counterattack culmination (supply, fatigue)
ca_culminate_days = 3

# v5: supply throughput as the constraint. Blue on short interior
# lines (flat theater capacity); red pays per km gained — LOC
# stretch cuts its axis throughput toward zero at full depth.
# All values placeholder scale; FM 101-10-1 (on the shelf) is the
# calibration bench for real consumption planning factors.
supply_floor = 0.45        # output floor when completely starved
blue_supply_points = 55.0
blue_demand_per_cv = 1.0
red_supply_points = 110.0
red_demand_per_cv = 1.0
red_loc_penalty = 0.55     # fill lost per fraction of theater depth gained

# v5: sea state closes the WP landing window on a drawn day
# (November climatology PLACEHOLDER); beach-watch units release then
amphib_close_min = 10
amphib_close_max = 17

# v6: red operational pauses (the pulsed offensive — a starved red
# builds supply forward instead of grinding at the floor)
red_pause_fill = 0.55    # flow fill below which red pauses
red_resume_fill = 1.0    # (flow+stockpile)/demand needed to resume
red_pause_buildup = 25.0 # supply points built forward per pause day
pause_intensity = 0.25   # contact intensity while paused

# v6: what blue's deep fires attack (CLI --deep-target overrides)
deep_target = "echelon"     # "echelon" (delay arrivals) | "throughput"
deep_supply_per_point = 6.0 # red flow cut per deep point-day (throughput mode)

# v6: pursuit — counterattacks into a supply-starved red bite deeper
ca_pursuit_fill = 0.5
ca_pursuit_mult = 2.0

[[axes]]
name = "coastal-luebeck"
length_km = 95  # Travemünde approaches -> Kiel Canal, roughly
hold_km = 55    # political stand line short of the Canal approaches — toy
note = "Baltic coast axis; amphib threat on the flank NOT modeled yet"

[[axes]]
name = "inland-bad-segeberg"
